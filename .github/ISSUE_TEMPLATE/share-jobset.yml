name: 分享作业集
description: 投稿你的 MAAPVZ 作业集，审核通过后会上架到分享站
title: "投稿："
labels: ["投稿"]
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！**把编辑器导出的 .json 文件直接拖进下方「作业集 JSON」框**（GitHub 会自动上传成附件链接），也可以直接粘贴 JSON 全文。
        提交后机器人会自动校验：通过则自动开 PR 等待维护者审核，不通过会在本 Issue 下评论原因，**直接编辑本 Issue** 即可重新校验。
  - type: textarea
    id: body_json
    attributes:
      label: 作业集 JSON
      description: 把 .json 文件拖进来（推荐，会变成附件链接），或粘贴 JSON 全文
      placeholder: "把 .json 文件拖到这里"
      render: json
    validations:
      required: true
  - type: textarea
    id: costumes
    attributes:
      label: 装扮标注
      description: 作业集里出现的每一棵植物都要标注「需要/不需要」装扮，每行一条，一颗不落
      placeholder: "娜迦蛇皮果:需要&#10;大嘴花:不需要"
    validations:
      required: true
  - type: input
    id: worlds
    attributes:
      label: 适用世界
      description: 这份作业集能打哪些世界（必填，至少一个），顿号分隔
      placeholder: "埃及、海盗"
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者昵称
      description: 会显示在站点卡片上（可选）
    validations:
      required: false
  - type: input
    id: desc
    attributes:
      label: 一句话简介
      description: 会显示在站点卡片上（可选）
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: 补充说明（适用世界/关卡范围/注意事项）
    validations:
      required: false
