name: 重建作业集索引（手动）

# 平时不用它：本地维护工具每次写操作都会自动重建 index.json，跟着你的 commit 一起提交。
# 只有在「直接改了 jobs/ 却没重建索引」时才需要：
#   仓库 → Actions → 重建作业集索引（手动） → Run workflow
# 这是手动触发，不是自动机器人，不会在你每次 push 后自己提交。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 重建 index.json
        run: python tools/build_index.py

      - name: 提交（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json 无变化，跳过提交"
          else
            git commit -m "chore: 手动重建 index.json"
            git push
          fi
