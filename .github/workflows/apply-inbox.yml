name: 应用上架包

# 维护者在网页把 *.bundle.json 传进 inbox/ → 这里自动拆包落库 + 重建索引。
# 不涉及 Issue、不涉及 PR：只是把「一个文件」展开成 jobs/ 目录树。
on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 拆包落库
        run: python tools/apply_inbox.py

      - name: 提交并推送（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs inbox index.json
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore: 应用上架包 [skip ci]"
            git push
          fi
