name: 应用上架包（仅在 inbox/ 有包时）

# 这是唯一会自动提交的 Action，而且只在你把 *.bundle.json 传进 inbox/ 时才会跑：
#   inbox/ 有新包 → 拆包写进 jobs/ → 重建 index.json → 一次性提交（带 [skip ci]，不会自我循环）
# 它不涉及 Issue、不涉及 PR，也不是「每次 push 都重建索引」的那种机器人
#（那种已经在 v2 里删掉了：index.json 现在由本地维护工具生成，跟着你的 commit 一起提交）。
on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 拆包落库（并重建 index.json）
        run: python tools/apply_inbox.py

      - name: 提交并推送（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs inbox index.json
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore: 应用 inbox 上架包 [skip ci]"
            git push
          fi
