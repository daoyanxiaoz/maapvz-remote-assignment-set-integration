name: 重建作业集索引

on:
  push:
    branches: [main]
    paths:
      # 目录树就是数据源：jobs/ 下面任何变化都重建索引
      - "jobs/**"
      - "tools/**"
  workflow_dispatch: # 允许手动触发兜底

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来取文件的最后提交时间

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 重建 index.json
        run: python tools/build_index.py

      - name: 提交并推送（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json 无变化，跳过提交"
          else
            # [skip ci] 防止本次提交再次触发 workflow 造成循环
            git commit -m "chore: rebuild index.json [skip ci]"
            git push
          fi
