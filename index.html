<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAPVZ 作业集分享站</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="MAAPVZ"
           onerror="this.hidden=true;document.getElementById('title-emoji').hidden=false">
      <span id="title-emoji" hidden>🌻</span>
      MAAPVZ 作业集分享站
      <small>植物大战僵尸2 · 无尽模式</small>
    </a>
    <nav>
      <a class="nav-link active" href="index.html">首页</a>
      <a class="nav-link" href="publish.html">上架作业集</a>
      <a class="nav-link" href="about.html">关于</a>
      <a class="nav-link external" href="https://github.com/daoyanxiaoz/maapvz-remote-assignment-set-integration" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<div class="subbar">
  <div class="subbar-inner">
    <span class="desc">浏览、下载玩家分享的作业集，导入 MAAPVZ 编辑器即可使用</span>
    <div class="stats">
      <span class="badge">作业集 <b id="stat-count">-</b> 套</span>
      <span class="badge">版本 <b id="stat-versions">-</b> 个</span>
      <span class="badge">索引更新 <b id="stat-updated">-</b></span>
    </div>
    <div class="search-box">
      <input id="search" type="search" placeholder="搜索名称 / code / 作者 / 阵型 / 标签…" autocomplete="off">
    </div>
  </div>
</div>

<main>
  <div class="group-bar" id="group-bar" hidden>
    <span class="filter-label">阵型</span>
    <button class="group-chip on" id="group-all" type="button">全部（0）</button>
    <div class="picker" id="group-picker">
      <button class="group-chip picker-toggle" id="group-toggle" type="button">常见阵型 ▾</button>
      <div class="picker-panel group-panel" id="group-panel" hidden>
        <div class="picker-list group-list" id="group-list"></div>
      </div>
    </div>
  </div>
  <div class="group-desc" id="group-desc" hidden></div>

  <div class="filter-bar" id="filter-bar" hidden>
    <div class="filter-group" id="f-worlds" hidden>
      <span class="filter-label">世界</span>
      <span id="world-chips"></span>
    </div>
    <div class="filter-group">
      <span class="filter-label">植物</span>
      <div class="picker" id="plant-picker">
        <button class="picker-toggle" id="plant-toggle" type="button">全部植物 ▾</button>
        <div class="picker-panel" id="plant-panel" hidden>
          <input id="plant-search" type="search" placeholder="搜索植物名…" autocomplete="off">
          <div class="picker-list" id="plant-list"></div>
        </div>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">装扮</span>
      <div class="tri" id="costume-tri">
        <button type="button" data-v="all" class="on">全部</button>
        <button type="button" data-v="none">全无需装扮</button>
        <button type="button" data-v="required">含需装扮植物</button>
      </div>
    </div>
  </div>

  <div id="state-loading" class="state">加载中…</div>
  <div id="state-error" class="state error" hidden>
    作业集清单加载失败 😢<br><br>
    <small id="error-detail"></small>
  </div>
  <div id="state-empty" class="state" hidden>没有匹配的作业集，换个关键词或筛选条件试试？</div>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <div>
    <a href="https://github.com/daoyanxiaoz/maapvz-remote-assignment-set-integration" target="_blank" rel="noopener">GitHub 仓库</a>
  </div>
  <div>作业集格式由 <a href="https://github.com/daoyanxiaoz/MAAPVZ" target="_blank" rel="noopener">MAAPVZ</a> 编辑器导出</div>
</footer>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  var elLoading = document.getElementById("state-loading");
  var elError = document.getElementById("state-error");
  var elEmpty = document.getElementById("state-empty");
  var elSearch = document.getElementById("search");
  var elToast = document.getElementById("toast");
  var jobs = [];
  var PLANT_EN = {};    // 植物中文名 → 英文文件名
  var PLANT_RARE = {};  // 植物中文名 → 稀有度 0~4（card_bg 底图）
  var toastTimer = null;

  // 筛选状态
  var fGroup = "";      // 选中的总分组（"" = 全部）
  var fWorlds = {};     // 选中的世界
  var fPlants = {};     // 选中的植物
  var fCostume = "all"; // all | none | required
  var GROUPS = [];      // index.json 里的分组列表

  // 世界 → 卡片顶部色带（worlds 空 → 不画）
  var WORLD_BAND = [
    ["埃及", "#d4a017"], ["海盗", "#2e86c1"], ["西部", "#b9770e"], ["未来", "#7b5aa6"],
    ["功夫", "#c0392b"], ["黑暗", "#5d4a8a"], ["沙滩", "#e67e22"], ["冰河", "#5dade2"],
    ["天空", "#7c95e8"], ["失落", "#b7950b"], ["摇滚", "#af4c8f"], ["恐龙", "#1e8449"],
    ["摩登", "#707b7c"], ["蒸汽", "#9c640c"], ["复兴", "#8e44ad"], ["平安", "#cd6155"],
    ["童话", "#ec87b8"], ["亚特兰蒂斯", "#148f77"], ["地宫", "#8c6239"], ["月球", "#2e4053"]
  ];

  function worldBand(worlds) {
    if (Array.isArray(worlds)) {
      for (var i = 0; i < worlds.length; i++) {
        var w = String(worlds[i]);
        for (var j = 0; j < WORLD_BAND.length; j++) {
          if (w.indexOf(WORLD_BAND[j][0]) !== -1) return WORLD_BAND[j][1];
        }
      }
    }
    return null;
  }

  // 覆盖条配色：草坪绿系深浅轮换（按表序）
  var COV_SHADES = ["#5da130", "#86bd50", "#4a8527", "#a5d176", "#3c7023", "#6fb03e"];

  // 内联 SVG 图标（静态字符串，非用户数据）
  var SVG_COPY = '<svg viewBox="0 0 16 16"><path d="M4 2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-1v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h1V2zm2 0v1h4a2 2 0 0 1 2 2v5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1h1zM3 4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H3z" transform="translate(1,1) scale(0.875)"/></svg>';
  var SVG_LINK = '<svg viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l3-3a3 3 0 1 0-4.24-4.24l-1.5 1.5a4.98 4.98 0 0 0-1.13 1.13 2.99 2.99 0 0 1 2.63-.62l1.5-1.5a2 2 0 1 1 2.83 2.83l-3 3a2 2 0 0 1-2.83-2.83l1-1a4.98 4.98 0 0 0-1.5 1.1l-1-1z"/><path d="M9.5 6.5a3 3 0 0 0-4.24 0l-3 3a3 3 0 1 0 4.24 4.24l1.5-1.5c.4-.4.8-.75 1.13-1.13a2.99 2.99 0 0 1-2.63.62l-1.5 1.5a2 2 0 1 1-2.83-2.83l3-3a2 2 0 0 1 2.83 2.83l-1 1c.5.4 1 .8 1.5 1.1l1-1z" transform="translate(0.2,0.2) scale(0.95)"/></svg>';

  function showToast(text) {
    elToast.textContent = text;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 1800);
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast(okMsg); }
      catch (e) { showToast("复制失败，请手动复制"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { showToast(okMsg); },
        function () { fallback(); }
      );
    } else {
      fallback();
    }
  }

  function formatTime(iso) {
    if (!iso) return "未知";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // ★ 用户数据一律走 textContent，防注入
    return e;
  }

  function iconBtn(svg, title, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "icon-btn";
    b.title = title;
    b.innerHTML = svg; // 静态 SVG，非用户输入
    b.addEventListener("click", onClick);
    return b;
  }

  // 仓库里的中文/空格路径：逐段 encodeURIComponent，保住 "/" 分隔
  function encPath(p) {
    return String(p || "").split("/").map(encodeURIComponent).join("/");
  }

  function detailUrl(job, versionLabel) {
    var u = "job.html?id=" + encodeURIComponent(job.id);
    if (versionLabel) u += "&v=" + encodeURIComponent(versionLabel);
    return u;
  }

  function latestVersion(job) {
    return (Array.isArray(job.versions) && job.versions.length) ? job.versions[0] : null;
  }

  function fileUrl(job) {
    var v = latestVersion(job);
    return v ? encPath(v.file) : "";
  }

  // 关卡覆盖条：图层规则 = 数组里先出现的表优先；levels 是权威覆盖，
  // 空则退化为 [from, to) 连续区间；to=null → 到 MAX
  function buildCoverageBar(coverage, maxLevel) {
    var frag = document.createDocumentFragment();
    var bar = el("div", "cov-bar");
    frag.appendChild(bar);
    if (!Array.isArray(coverage) || !coverage.length) return frag;
    var max = maxLevel || 149;
    var owner = new Array(max + 1).fill(-1);
    coverage.forEach(function (c, ti) {
      if (Array.isArray(c.levels) && c.levels.length) {
        c.levels.forEach(function (lv) {
          lv = Math.round(Number(lv));
          if (lv >= 1 && lv <= max && owner[lv] === -1) owner[lv] = ti;
        });
      } else if (typeof c.from === "number") {
        var t = (typeof c.to === "number") ? Math.min(c.to - 1, max) : max;
        for (var u = Math.max(1, Math.round(c.from)); u <= t; u++) {
          if (owner[u] === -1) owner[u] = ti;
        }
      }
    });
    var u = 1;
    while (u <= max) {
      var o = owner[u], v = u;
      while (v <= max && owner[v] === o) v++;
      if (o !== -1) {
        var seg = document.createElement("div");
        seg.className = "cov-seg";
        seg.style.left = ((u - 1) / max * 100) + "%";
        seg.style.width = ((v - u) / max * 100) + "%";
        seg.style.background = COV_SHADES[o % COV_SHADES.length];
        var c = coverage[o];
        seg.title = "表" + (o + 1) + "：" + c.from + "~" +
                    (typeof c.to === "number" ? (c.to - 1) : "MAX") + " 关";
        bar.appendChild(seg);
      }
      u = v;
    }
    var label = el("div", "cov-label");
    label.appendChild(el("span", null, "关卡覆盖"));
    label.appendChild(el("span", null, "1 ~ " + max));
    frag.appendChild(label);
    return frag;
  }

  // 植物图标（稀有度底图垫底）；无图 → 文字块
  function plantSlot(name) {
    var slot = el("span", "plant-slot");
    var rare = PLANT_RARE[name];
    if (rare != null) {
      slot.style.backgroundImage = "url(img/card_bg/rare_" + rare + ".webp)";
    }
    var en = PLANT_EN[name];
    if (en) {
      var img = document.createElement("img");
      img.src = "img/plants/" + en + ".webp";
      img.alt = String(name);
      img.title = String(name);
      img.loading = "lazy";
      img.onerror = function () {
        this.remove();
        slot.appendChild(el("span", "plant-fallback", String(name).slice(0, 4)));
      };
      slot.appendChild(img);
    } else {
      slot.appendChild(el("span", "plant-fallback", String(name).slice(0, 4)));
    }
    return slot;
  }

  // —— 卡片三要素：基础信息 + 覆盖预览条 + 阵容植物图标排 ——
  function buildCard(job) {
    var card = el("div", "card");
    var band = worldBand(job.worlds);
    if (band) card.style.setProperty("--band", band);

    // 名称 = 详情页链接（作业集身份是「分组/名称」，不是 code）
    var nameDiv = el("div", "name");
    var nameLink = el("a", null, job.name || job.code || job.id);
    nameLink.href = detailUrl(job);
    nameDiv.appendChild(nameLink);
    card.appendChild(nameDiv);

    // code：名字下方小字 + 复制图标（最新的那一版）
    var codeRow = el("div", "code-row");
    codeRow.appendChild(el("span", "code-text", job.code || "（无 code）"));
    if (job.code) {
      codeRow.appendChild(iconBtn(SVG_COPY, "复制 code", function () {
        copyText(job.code, "已复制 code");
      }));
    }
    card.appendChild(codeRow);

    // 阵型标签（有阵型才显示）+ 主世界 + 作业集标签（紫色 #标签）
    var tagRow = el("div", "tags");
    var groupLabel = String(job.group_name || job.group || "").trim();
    if (job.group) {
      var gTag = el("a", "tag tag-group", groupLabel || job.group);
      gTag.href = "index.html?group=" + encodeURIComponent(job.group);
      gTag.title = "只看「" + (groupLabel || job.group) + "」这个阵型的作业集";
      tagRow.appendChild(gTag);
    }
    // 世界只显示主世界：副世界是「这套方案也能用」的兼容信息，详情页里看
    var primaryWorld = String(job.world_primary ||
      (Array.isArray(job.worlds) && job.worlds.length ? job.worlds[0] : "") || "").trim();
    if (primaryWorld && primaryWorld !== groupLabel) {
      var wTag = el("span", "tag", primaryWorld);
      if (Array.isArray(job.worlds) && job.worlds.length > 1) {
        wTag.title = "主世界（另有 " + (job.worlds.length - 1) + " 个副世界，详见详情页）";
      }
      tagRow.appendChild(wTag);
    }
    if (Array.isArray(job.tags)) {
      job.tags.forEach(function (t) {
        var name = String(t == null ? "" : t).trim();
        if (name) tagRow.appendChild(el("span", "tag purple", "#" + name));
      });
    }
    // 版本数徽标：点开详情页看历史版本
    var vCount = Array.isArray(job.versions) ? job.versions.length : 1;
    if (vCount > 1) {
      var vTag = el("a", "tag tag-ver", "v" + vCount);
      vTag.href = detailUrl(job);
      vTag.title = "共 " + vCount + " 个版本（点开看历史）";
      tagRow.appendChild(vTag);
    }
    if (tagRow.childNodes.length) card.appendChild(tagRow);

    // 关卡覆盖预览条
    card.appendChild(buildCoverageBar(job.coverage, job.max_level));

    // 阵容植物图标排（全量去重；空 = 编队换阵型）
    if (Array.isArray(job.plants) && job.plants.length) {
      var strip = el("div", "plant-strip");
      job.plants.forEach(function (p) { strip.appendChild(plantSlot(p)); });
      card.appendChild(strip);
    } else {
      card.appendChild(el("span", "deck-note", "编队换阵"));
    }

    // 基础信息：作者（可多人）· 最新更新时间 · 版本数
    var meta = el("div", "meta");
    var parts = [];
    var authors = Array.isArray(job.authors) && job.authors.length
      ? job.authors.map(function (a) { return String(a == null ? "" : a).trim(); }).filter(Boolean)
      : (job.author ? [String(job.author).trim()] : []);
    parts.push("作者：" + (authors.length ? authors.join("、") : "未知"));
    parts.push("更新于 " + formatTime(job.updated));
    if (vCount > 1) parts.push(vCount + " 个版本");
    meta.appendChild(el("span", null, parts.join(" · ")));
    if (job.desc) meta.appendChild(el("span", "desc", job.desc));
    card.appendChild(meta);

    // 下载（最新版本，阳光黄）+ 详情/复制链接
    var actions = el("div", "actions");
    var v = latestVersion(job);
    if (v) {
      var dl = el("a", "btn primary", "下载 JSON");
      dl.href = encPath(v.file);
      dl.setAttribute("download", (String(job.name || job.id).replace(/[\\/:*?"<>|]/g, "") || "作业集") +
        "_" + (v.date || v.label || "latest") + ".json");
      actions.appendChild(dl);
    }
    var detailBtn = el("a", "btn", "看详情");
    detailBtn.href = detailUrl(job);
    actions.appendChild(detailBtn);
    if (v) {
      actions.appendChild(iconBtn(SVG_LINK, "复制下载链接", function () {
        copyText(new URL(encPath(v.file), location.href).href, "链接已复制");
      }));
    }
    card.appendChild(actions);

    return card;
  }

  // —— 筛选（分组 / 世界 / 植物 / 装扮；标签只展示不过滤） ——
  function passFilters(j) {
    // 分组：目录名就是分组，单选
    if (fGroup && String(j.group) !== fGroup) return false;
    // 世界：选了才过滤；「无」命中 worlds 为空的作业集
    var ws = Object.keys(fWorlds);
    if (ws.length) {
      var jw = Array.isArray(j.worlds) ? j.worlds : [];
      var hit = ws.some(function (w) {
        if (w === "__none__") return jw.length === 0;
        return jw.some(function (jw1) {
          return jw1 === w || jw1.indexOf(w) !== -1 || w.indexOf(jw1) !== -1;
        });
      });
      if (!hit) return false;
    }
    // 植物：选中的每棵都要在作业集全量植物里
    var ps = Object.keys(fPlants);
    if (ps.length) {
      var jp = Array.isArray(j.plants) ? j.plants : [];
      if (!ps.every(function (p) { return jp.indexOf(p) !== -1; })) return false;
    }
    // 装扮：三态
    if (fCostume === "none" && j.costume !== "none") return false;
    if (fCostume === "required" && j.costume !== "required") return false;
    return true;
  }

  function render() {
    var q = elSearch.value.trim().toLowerCase();
    var list = jobs.filter(function (j) {
      if (!passFilters(j)) return false;
      if (!q) return true;
      var hay = [j.name, j.code, j.author, j.desc, j.group,
                 (Array.isArray(j.tags) ? j.tags.join(" ") : ""),
                 (Array.isArray(j.worlds) ? j.worlds.join(" ") : ""),
                 (Array.isArray(j.versions) ? j.versions.map(function (v) {
                   return (v.author || "") + " " + (v.label || "") + " " + (v.note || "");
                 }).join(" ") : "")]
        .filter(Boolean).join("\n").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    grid.innerHTML = "";
    list.forEach(function (j) { grid.appendChild(buildCard(j)); });
    elEmpty.hidden = list.length !== 0;
  }

  // —— 总分组：目录名即分组；收进「常见阵型」下拉，避免一排 chip 把页面撑臃肿 ——
  var groupItemEls = {};

  function setGroup(id, push) {
    fGroup = (id && GROUPS.some(function (g) { return g.id === id; })) ? id : "";
    var allBtn = document.getElementById("group-all");
    if (allBtn) allBtn.classList.toggle("on", !fGroup);
    Object.keys(groupItemEls).forEach(function (k) {
      groupItemEls[k].classList.toggle("on", k === fGroup);
    });
    var g = null;
    GROUPS.forEach(function (x) { if (x.id === fGroup) g = x; });

    // 下拉按钮显示当前选的阵型，便于一眼看出过滤状态
    var toggle = document.getElementById("group-toggle");
    if (toggle) toggle.textContent = (g ? g.name : "常见阵型") + " ▾";

    var desc = document.getElementById("group-desc");
    if (desc) {
      if (g) {
        desc.textContent = g.name + " · " + g.count + " 个作业集 · " + g.version_count + " 个版本" +
          (g.desc ? "　" + g.desc : "");
        desc.hidden = false;
      } else {
        desc.hidden = true;
      }
    }
    if (push !== false && window.history && window.history.replaceState) {
      var url = fGroup ? ("index.html?group=" + encodeURIComponent(fGroup)) : "index.html";
      window.history.replaceState(null, "", url);
    }
    render();
  }

  function setupGroups() {
    var bar = document.getElementById("group-bar");
    var list = document.getElementById("group-list");
    var allBtn = document.getElementById("group-all");
    var toggle = document.getElementById("group-toggle");
    var panel = document.getElementById("group-panel");
    if (!bar || !list || !allBtn || !toggle || !panel) return;

    allBtn.textContent = "全部（" + jobs.length + "）";
    allBtn.addEventListener("click", function () { setGroup(""); });

    list.innerHTML = "";
    function addItem(id, label, title) {
      var item = el("div", "picker-item" + (fGroup === id ? " on" : ""));
      item.appendChild(el("span", null, label));
      if (title) item.title = title;
      item.addEventListener("click", function () {
        setGroup(id);
        panel.hidden = true;
      });
      groupItemEls[id] = item;
      list.appendChild(item);
    }
    addItem("", "全部作业集（" + jobs.length + "）", "不按阵型过滤");
    GROUPS.forEach(function (g) {
      addItem(g.id, g.name + "（" + g.count + "）", g.desc || "");
    });

    toggle.addEventListener("click", function (ev) {
      ev.stopPropagation();
      panel.hidden = !panel.hidden;
    });
    document.addEventListener("click", function (ev) {
      var picker = document.getElementById("group-picker");
      if (picker && !picker.contains(ev.target)) panel.hidden = true;
    });
    bar.hidden = false;
  }

  function setupFilters() {
    // 世界 chips：固定 17 世界（官方全名）+ 末尾「无」（命中未标世界的作业集），点击多选。
    // 匹配做包含兼容：作业集存简称「失落」能命中 chip「失落之城」，反之亦然。
    var WORLDS = ["神秘埃及","海盗港湾","狂野西部","功夫世界","未来世界","黑暗时代",
                  "巨浪沙滩","冰河世界","天空之城","失落之城","摇滚年代","恐龙危机",
                  "摩登世界","蒸汽时代","复兴时代","童话世界","地宫世界"];
    var box = document.getElementById("f-worlds");
    var chips = document.getElementById("world-chips");
    WORLDS.concat(["无"]).forEach(function (w) {
      var key = w === "无" ? "__none__" : w;
      var c = el("button", "f-chip", w);
      c.type = "button";
      c.addEventListener("click", function () {
        if (fWorlds[key]) { delete fWorlds[key]; c.classList.remove("on"); }
        else { fWorlds[key] = 1; c.classList.add("on"); }
        render();
      });
      chips.appendChild(c);
    });
    box.hidden = false;

    // 标签不再做筛选：作业集自带标签直接以紫色 #标签 铺在卡片上，并参与搜索

    // 植物多选（可搜索）
    var plantSet = [];
    jobs.forEach(function (j) {
      (Array.isArray(j.plants) ? j.plants : []).forEach(function (p) {
        if (plantSet.indexOf(p) === -1) plantSet.push(p);
      });
    });
    plantSet.sort();
    var toggle = document.getElementById("plant-toggle");
    var panel = document.getElementById("plant-panel");
    var plist = document.getElementById("plant-list");
    var psearch = document.getElementById("plant-search");

    function refreshToggle() {
      var n = Object.keys(fPlants).length;
      toggle.textContent = n ? ("已选 " + n + " 种植物 ▾") : "全部植物 ▾";
    }
    function renderList() {
      var q = psearch.value.trim();
      plist.innerHTML = "";
      plantSet.forEach(function (p) {
        if (q && p.indexOf(q) === -1) return;
        var item = el("div", "picker-item" + (fPlants[p] ? " on" : ""));
        var en = PLANT_EN[p];
        if (en) {
          var img = document.createElement("img");
          img.src = "img/plants/" + en + ".webp";
          img.alt = "";
          img.loading = "lazy";
          img.onerror = function () { this.remove(); };
          item.appendChild(img);
        }
        item.appendChild(el("span", null, p));
        item.addEventListener("click", function () {
          if (fPlants[p]) delete fPlants[p]; else fPlants[p] = 1;
          item.classList.toggle("on");
          refreshToggle();
          render();
        });
        plist.appendChild(item);
      });
    }
    toggle.addEventListener("click", function () {
      panel.hidden = !panel.hidden;
      if (!panel.hidden) { renderList(); psearch.focus(); }
    });
    psearch.addEventListener("input", renderList);
    document.addEventListener("click", function (ev) {
      var picker = document.getElementById("plant-picker");
      if (!picker.contains(ev.target)) panel.hidden = true;
    });

    // 装扮三态
    var tri = document.getElementById("costume-tri");
    tri.addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      fCostume = b.getAttribute("data-v");
      tri.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      render();
    });

    document.getElementById("filter-bar").hidden = false;
  }

  elSearch.addEventListener("input", render);

  Promise.all([
    fetch("index.json", { cache: "no-store" }),
    fetch("data/plants.json", { cache: "no-store" })
  ])
    .then(function (rs) {
      if (!rs[0].ok) throw new Error("HTTP " + rs[0].status);
      return Promise.all([rs[0].json(), rs[1].ok ? rs[1].json() : []]);
    })
    .then(function (pair) {
      var data = pair[0], plants = pair[1];
      if (Array.isArray(plants)) {
        plants.forEach(function (p) {
          if (p && p.name) {
            if (p.en) PLANT_EN[p.name] = p.en;
            if (p.rare != null) PLANT_RARE[p.name] = p.rare;
          }
        });
      }
      jobs = Array.isArray(data.jobs) ? data.jobs : [];
      GROUPS = Array.isArray(data.groups) ? data.groups : [];
      document.getElementById("stat-count").textContent =
        data.count != null ? data.count : jobs.length;
      document.getElementById("stat-versions").textContent =
        data.version_count != null ? data.version_count : jobs.length;
      document.getElementById("stat-updated").textContent = formatTime(data.updated);
      elLoading.hidden = true;
      if (jobs.length) {
        setupGroups();
        setupFilters();
        var want = "";
        try {
          want = new URLSearchParams(location.search).get("group") || "";
        } catch (e) { want = ""; }
        setGroup(want, false);
      } else {
        render();
      }
    })
    .catch(function (err) {
      elLoading.hidden = true;
      elError.hidden = false;
      document.getElementById("error-detail").textContent =
        "index.json 读取失败：" + err.message +
        "（本地预览请用 python -m http.server 启动后再访问，file:// 直开无法读取清单）";
    });
})();
</script>
</body>
</html>
